name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify released commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean --release-notes=docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  flatpak:
    if: vars.BUILD_FLATPAK == 'true'
    runs-on: ubuntu-latest
    needs: goreleaser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Build emqutiti binary for Flatpak
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X github.com/marang/emqutiti/cmd.version=${GITHUB_REF_NAME#v}" \
            -o flatpak/emqutiti ./cmd/emqutiti

      - name: Build Flatpak repo
        run: |
          flatpak-builder --user --force-clean --repo=repo builddir \
            flatpak/io.github.marang.Emqutiti.yml

      - name: Build Flatpak bundle
        run: |
          flatpak build-bundle repo emqutiti.flatpak io.github.marang.Emqutiti \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Checksum Flatpak bundle
        run: sha256sum emqutiti.flatpak > emqutiti.flatpak.sha256

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emqutiti-flatpak
          path: emqutiti.flatpak

      - name: Upload Flatpak to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            emqutiti.flatpak
            emqutiti.flatpak.sha256
          overwrite_files: false
          fail_on_unmatched_files: true
